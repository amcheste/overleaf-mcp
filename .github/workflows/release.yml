name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Acceptance canary: end-to-end suite against a real Overleaf project.
  # NON-BLOCKING. Overleaf git *write* requires an active premium plan, so
  # gating the publish on this made releases hostage to a live paid
  # third-party credential — a lapsed plan blocked an otherwise-good
  # release. `continue-on-error` + the build job no longer `needs:` this,
  # so a failure here does NOT stop the publish. It runs as a
  # release-moment signal only; nightly.yml is the dedicated daily canary.
  # To restore a hard gate: re-add `needs: acceptance` to build and drop
  # `continue-on-error`. Same concurrency group as the PR-level
  # real-overleaf job so two CI runs never fight over the shared remote.
  acceptance:
    name: Acceptance tests against real Overleaf (non-blocking)
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'amcheste/overleaf-mcp' }}
    continue-on-error: true
    concurrency:
      group: overleaf-real-ci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run acceptance suite
        env:
          OVERLEAF_TEST_PROJECT_ID: ${{ secrets.OVERLEAF_TEST_PROJECT_ID }}
          OVERLEAF_TEST_TOKEN: ${{ secrets.OVERLEAF_TEST_TOKEN }}
        run: uv run pytest -m acceptance -v

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/overleaf-mcp-server
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
