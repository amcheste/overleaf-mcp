name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test with coverage
        run: uv run pytest --cov

  wheel-smoke:
    name: Wheel install smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel and sdist
        run: uv build

      - name: Install built wheel into a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl

      # Catches the v0.1.0 --version crash class: bugs that only manifest
      # in the installed artifact, not in `uv run` against the source tree.
      - name: Smoke CLI commands against installed package
        run: |
          set -e
          /tmp/smoke-venv/bin/overleaf-mcp --version
          /tmp/smoke-venv/bin/overleaf-mcp --help
          /tmp/smoke-venv/bin/overleaf-mcp serve --help
          /tmp/smoke-venv/bin/overleaf-mcp init --help
          /tmp/smoke-venv/bin/overleaf-mcp doctor --help
          /tmp/smoke-venv/bin/overleaf-mcp auth --help
          /tmp/smoke-venv/bin/overleaf-mcp auth add --help
          /tmp/smoke-venv/bin/overleaf-mcp auth remove --help
          /tmp/smoke-venv/bin/overleaf-mcp auth list --help

  # Exercises the full edit_file flow against a real Overleaf project.
  # Gated on (a) running in the canonical repo (forks don't have the
  # secrets) and (b) the secrets actually being present (skips cleanly
  # if someone deletes them). Concurrency-grouped so two CI runs don't
  # race each other against the shared remote — Overleaf's git remote
  # is a single branch, so concurrent ff-only pulls would conflict.
  #
  # Intentionally NOT in the required-status-checks list. Overleaf API
  # outages would gate every PR. Promote to required after a few weeks
  # of clean signal.
  real-overleaf:
    name: Real Overleaf round-trip
    needs: test
    if: ${{ github.repository == 'amcheste/overleaf-mcp' }}
    runs-on: ubuntu-latest
    concurrency:
      group: overleaf-real-ci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Real Overleaf round-trip
        env:
          OVERLEAF_TEST_PROJECT_ID: ${{ secrets.OVERLEAF_TEST_PROJECT_ID }}
          OVERLEAF_TEST_TOKEN: ${{ secrets.OVERLEAF_TEST_TOKEN }}
        run: uv run pytest tests/test_real_overleaf.py -v
