name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Unit + integration suite, matrixed across 3 OSes × 3 Python versions.
  # `fail-fast: false` so a Windows-specific failure doesn't hide ubuntu
  # results we still need.
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Configure git identity for tests
        shell: bash
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test with coverage
        run: uv run pytest --cov

  # Single required check name regardless of how the matrix grows.
  # Branch protection requires `Tests / All passed`, not each cell.
  test-summary:
    name: All tests passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every matrix cell passed
        shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::At least one matrix cell failed (result=${{ needs.test.result }})"
            exit 1
          fi
          echo "All test matrix cells passed."

  # ─────────────────────────────────────────────────────────────────────
  # Wheel install smoke — proves the *built artifact* works, not just
  # the source tree. Catches the v0.1.0 --version crash class. Now
  # matrixed across all three OSes; wheel format is portable but the
  # entry-point script wrapper differs on Windows (Scripts/ vs bin/).
  # ─────────────────────────────────────────────────────────────────────
  wheel-smoke:
    name: Wheel install smoke (${{ matrix.os }})
    needs: test-summary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel and sdist
        run: uv build

      # Cross-platform: pure-Python script handles Windows's Scripts/
      # vs Linux/macOS's bin/ entry-point location, and avoids glob
      # expansion differences in the wheel path.
      - name: Install wheel and smoke-test the CLI
        shell: python {0}
        run: |
          import subprocess, sys, venv
          from pathlib import Path

          venv_dir = Path("smoke-venv")
          venv.create(venv_dir, with_pip=True)
          bin_dir = venv_dir / ("Scripts" if sys.platform == "win32" else "bin")
          pip = bin_dir / ("pip.exe" if sys.platform == "win32" else "pip")
          cli = bin_dir / ("overleaf-mcp.exe" if sys.platform == "win32" else "overleaf-mcp")

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly 1 wheel, got {wheels}"
          subprocess.run([str(pip), "install", str(wheels[0])], check=True)

          for args in [
              ["--version"], ["--help"],
              ["serve", "--help"],
              ["init", "--help"],
              ["doctor", "--help"],
              ["auth", "--help"],
              ["auth", "add", "--help"],
              ["auth", "remove", "--help"],
              ["auth", "list", "--help"],
          ]:
              print(f"$ overleaf-mcp {' '.join(args)}", flush=True)
              subprocess.run([str(cli)] + args, check=True)

  wheel-smoke-summary:
    name: All wheel-smoke tests passed
    needs: wheel-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every wheel-smoke cell passed
        shell: bash
        run: |
          if [ "${{ needs.wheel-smoke.result }}" != "success" ]; then
            echo "::error::At least one wheel-smoke cell failed (result=${{ needs.wheel-smoke.result }})"
            exit 1
          fi
          echo "All wheel-smoke cells passed."

  # ─────────────────────────────────────────────────────────────────────
  # Real-Overleaf round-trip stays single-OS. The integration is the
  # important signal; the OS-of-the-runner is incidental and would just
  # serialize against the shared remote.
  # ─────────────────────────────────────────────────────────────────────
  real-overleaf:
    name: Real Overleaf round-trip
    needs: test-summary
    if: ${{ github.repository == 'amcheste/overleaf-mcp' }}
    runs-on: ubuntu-latest
    concurrency:
      group: overleaf-real-ci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Real Overleaf round-trip
        env:
          OVERLEAF_TEST_PROJECT_ID: ${{ secrets.OVERLEAF_TEST_PROJECT_ID }}
          OVERLEAF_TEST_TOKEN: ${{ secrets.OVERLEAF_TEST_TOKEN }}
        run: uv run pytest tests/test_real_overleaf.py -v
