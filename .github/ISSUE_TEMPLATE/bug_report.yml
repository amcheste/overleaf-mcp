name: Bug report
description: Something is broken in overleaf-mcp-server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before filing, please
        check that this isn't a security issue. See [SECURITY.md](https://github.com/amcheste/overleaf-mcp/blob/main/SECURITY.md)
        for the private disclosure flow if it is.
  - type: input
    id: version
    attributes:
      label: Version
      description: What's the output of `overleaf-mcp --version`?
      placeholder: "overleaf-mcp, version 0.3.0"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: Which transport were you using when you hit this?
      options:
        - stdio (Claude Desktop, Claude Code, etc.)
        - HTTP (serve-http)
        - Both / N/A
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include any commands you ran and their output (with tokens redacted).
      placeholder: |
        1. ...
        2. ...
        3. error appears
    validations:
      required: true
  - type: textarea
    id: doctor_output
    attributes:
      label: `overleaf-mcp doctor` output
      description: Output of `overleaf-mcp doctor` (redact any tokens or sensitive paths).
      render: shell
